name: Build and Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Prepare DB for Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "project"
          Copy-Item -Path "talmud.db" -Destination "project/talmud.db"
      - name: Build with PyInstaller
        shell: powershell
        run: pyinstaller --noconfirm --onefile --windowed --add-data "project/talmud.db;project" main.py