name: Build and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-arm
          - os: macos-13
            platform: mac-intel

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Version
        id: get_version
        shell: bash
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l "v1.*" | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then NEW="v1.12"; else
            MINOR=$(echo $LATEST | cut -d. -f2)
            NEW="v1.$((MINOR + 1))"
          fi
          echo "tag=$NEW" >> $GITHUB_OUTPUT

      - name: Deps
        run: pip install pyinstaller gdown PyQt6 PyQt6-Qt6 Pillow

      - name: DB
        run: gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

      - name: Build Windows
        if: matrix.platform == 'win'
        shell: powershell
        run: |
          choco install innosetup --no-progress
          pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="TalmudicFormulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
          pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="TalmudicFormulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-portable main.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.get_version.outputs.tag }}" "setup_script.iss"

      - name: Build Mac
        if: startsWith(matrix.platform, 'mac')
        run: |
          brew install create-dmg
          ARCH=$(uname -m)
          pyinstaller --noconfirm --windowed --name="TalmudicFormulas-Mac-$ARCH" --add-data "talmud.db:." --add-data "widgets:widgets" --add-data "assets:assets" --collect-all PyQt6 --distpath ./dist main.py
          create-dmg --volname "Talmudic Formulas" "TalmudicFormulas-$ARCH-Installer.dmg" "dist/TalmudicFormulas-Mac-$ARCH.app" || true
          zip -r "TalmudicFormulas-Mac-$ARCH-Portable.zip" "dist/TalmudicFormulas-Mac-$ARCH.app"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Version ${{ steps.get_version.outputs.tag }}
          files: |
            Output/*.exe
            dist-portable/*.exe
            *.dmg
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
