name: Build and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # שימוש ב-macos-13 (Intel) עם בנייה ל-Universal2 מכסה גם אינטל וגם M1/M2/M3
        os: [windows-latest, macos-13]
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Version
      id: get_version
      shell: bash
      run: |
        git fetch --tags
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0")
        VERSION_MINOR=$(echo $LATEST_TAG | cut -d. -f2)
        NEW_MINOR=$((VERSION_MINOR + 1))
        NEW_TAG="v1.$NEW_MINOR"
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "version_pure=1.$NEW_MINOR" >> $GITHUB_OUTPUT

    - name: Create Git Tag
      shell: bash
      run: |
        git tag ${{ steps.get_version.outputs.new_tag }}
        git push origin ${{ steps.get_version.outputs.new_tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        pip install pyinstaller PyQt6 gdown macholib
        # כפיית התקנה שתומכת בארכיטקטורה הכפולה
        pip install --upgrade --force-reinstall PyQt6 PyQt6-Qt6

    - name: Download DB from Google Drive
      shell: bash
      run: |
        # התיקון הקריטי: בלי --id
        gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        choco install innosetup --no-progress
        pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="Talmudic-Formulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-portable main.py
        pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="Talmudic-Formulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
        
        $VERSION = "${{ steps.get_version.outputs.version_pure }}"
        $iss = Get-Content "setup_script.iss" -Raw
        $iss = $iss -replace 'AppVersion=.*', "AppVersion=$VERSION"
        $Utf8WithBom = New-Object System.Text.UTF8Encoding($true)
        [System.IO.File]::WriteAllText("setup_script.iss", $iss, $Utf8WithBom)
        
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup_script.iss"

    - name: Build macOS (Universal2)
      if: matrix.os == 'macos-13'
      run: |
        # הפתרון למק: בנייה שתעבוד על כל המעבדים
        pyinstaller --noconfirm --windowed \
          --target-arch universal2 \
          --name="Talmudic-Formulas-Mac" \
          --add-data "talmud.db:." \
          --add-data "widgets:widgets" \
          --add-data "assets:assets" \
          --collect-all PyQt6 \
          main.py
        cd dist && zip -r ../Talmudic-Formulas-Mac-Portable.zip Talmudic-Formulas-Mac.app && cd ..
        mkdir dmg_root
        cp -R "dist/Talmudic-Formulas-Mac.app" dmg_root/
        hdiutil create -volname "Talmudic Formulas" -srcfolder dmg_root -ov -format UDZO "Talmudic-Formulas-Mac-Installer.dmg"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.new_tag }}
        name: גרסה ${{ steps.get_version.outputs.new_tag }}
        files: |
          dist-portable/Talmudic-Formulas-Portable.exe
          Output/Talmudic-Formulas-Setup-Win.exe
          Talmudic-Formulas-Mac-Portable.zip
          Talmudic-Formulas-Mac-Installer.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}