name: Build and Release

on:
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "main_window.py"
      - "db.py"
      - "settings_manager.py"
      - "styles.py"
      - "utils.py"
      - "icons.py"
      - "widgets/**"
      - "assets/**"
      - "icon.ico"
      - "setup_script.iss"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: get_version
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | tr -d 'v' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | tr -d 'v' | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEXT_MINOR}"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG"

  download-db:
    name: Download DB from release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check and download talmud.db
        run: |
          # שימו לב: actions/checkout@v4 אינו מוריד קבצי Git LFS כברירת מחדל,
          # ולכן ה-talmud.db שמגיע מה-repo עלול להיות קובץ מצביע (LFS pointer)
          # זעיר של ~130 בתים — ולא בסיס הנתונים האמיתי (~1GB).
          # לכן בודקים שזה באמת קובץ SQLite; אם לא — מורידים את האמיתי מה-Release.
          need_download=0
          if [ ! -f talmud.db ]; then
            echo "⚠️  talmud.db not present"
            need_download=1
          elif head -c 16 talmud.db | grep -q "SQLite format 3"; then
            echo "✅ Real SQLite talmud.db found in repo - using existing copy"
          else
            echo "⚠️  talmud.db is not a real DB (likely a Git LFS pointer) - downloading from release"
            echo "----- file head -----"
            head -c 200 talmud.db || true
            echo ""
            echo "---------------------"
            need_download=1
          fi

          if [ "$need_download" -eq 1 ]; then
            echo "⬇️  Downloading talmud.db from release..."
            curl -f -L -o talmud.db \
              "https://github.com/ACHI-GARCINAN/Talmud-Formulas-Software/releases/download/1.0/talmud.db"
          fi

          # אימות סופי: הקובץ חייב להיות SQLite DB אמיתי — אחרת מפילים את הבנייה
          # כדי שלעולם לא תיווצר שוב גרסה בלי בסיס נתונים בשקט.
          if ! head -c 16 talmud.db | grep -q "SQLite format 3"; then
            echo "❌ talmud.db is NOT a valid SQLite database - aborting"
            exit 1
          fi
          echo "✅ Verified: valid SQLite database"
          ls -lh talmud.db

      - name: Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: talmud-db
          path: talmud.db
          retention-days: 3

  build:
    name: Build on ${{ matrix.os }}
    needs: [version, download-db]
    runs-on: ${{ matrix.os }}
    # אם ראנר נתקע ("Waiting for a runner...") — ניכשל אחרי שעה במקום לתלות 6 שעות
    timeout-minutes: 60
    # רגל ה-Intel מסומנת experimental: כשל שלה לא יכשיל את הבנייה ולא יחסום את הריליס
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos
            arch: intel
            label: Intel
            experimental: true
          - os: macos-14
            platform: macos
            arch: silicon
            label: AppleSilicon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache pip (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: talmud-db

      - name: Verify DB
        shell: bash
        run: |
          ls -lh talmud.db
          # ודא שזה בסיס נתונים אמיתי לפני האריזה — לא קובץ מצביע של LFS
          if ! head -c 16 talmud.db | grep -q "SQLite format 3"; then
            echo "❌ talmud.db is NOT a valid SQLite database - aborting build"
            exit 1
          fi
          echo "✅ Verified valid SQLite database before packaging"

      # ── Windows Build ──
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes

          # גרסת installer
          # ודא שקובץ talmud.db נגיש בתיקייה הנוכחית
          Write-Output "Checking for talmud.db in $(Get-Location)"
          Get-ChildItem -Path . -Filter talmud.db -Force | Format-List -Property FullName,Length

          $dbPath = Join-Path (Get-Location) "talmud.db"
          
          pyinstaller --noconfirm --onedir --windowed `
            --icon="icon.ico" `
            --name="TalmudicFormulas" `
            --add-data "$dbPath;." `
            --add-data "icon.ico;." `
            --add-data "widgets;widgets" `
            --add-data "assets;assets" `
            --collect-all PyQt6 `
            --hidden-import "PyQt6.QtSvg" `
            --hidden-import "PyQt6.QtSvgWidgets" `
            --distpath ./dist-installer `
            main.py

          # גרסה ניידת
          pyinstaller --noconfirm --onefile --windowed `
            --icon="icon.ico" `
            --name="TalmudicFormulas-Portable" `
            --add-data "$dbPath;." `
            --add-data "icon.ico;." `
            --add-data "widgets;widgets" `
            --add-data "assets;assets" `
            --collect-all PyQt6 `
            --hidden-import "PyQt6.QtSvg" `
            --hidden-import "PyQt6.QtSvgWidgets" `
            --distpath ./dist-portable `
            main.py

          # הרצת Inno Setup עם מספר גרסה דינמי
          # שימו לב: MyAppVersion מועבר מבחוץ ומחליף את ההגדרה הסטטית ב-ISS
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ needs.version.outputs.tag }}" `
            "setup_script.iss"

      # ── macOS Build (נטיבי לכל ארכיטקטורה: Intel על macos-13, Apple Silicon על macos-14) ──
      - name: Build macOS (${{ matrix.label }})
        if: matrix.platform == 'macos'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install create-dmg

          pyinstaller \
            --noconfirm \
            --windowed \
            --name "TalmudicFormulas" \
            --add-data "talmud.db:." \
            --add-data "icon.ico:." \
            --add-data "widgets:widgets" \
            --add-data "assets:assets" \
            --collect-all PyQt6 \
            --hidden-import "PyQt6.QtSvg" \
            --hidden-import "PyQt6.QtSvgWidgets" \
            main.py

          # אימות שהבינארי נבנה אכן עבור הארכיטקטורה הצפויה (arm64 / x86_64)
          echo "Built architecture (${{ matrix.label }}):"
          lipo -archs "dist/TalmudicFormulas.app/Contents/MacOS/TalmudicFormulas" || true

          create-dmg \
            --volname "Talmudic Formulas (${{ matrix.label }})" \
            "TalmudicFormulas-Mac-${{ matrix.label }}.dmg" \
            "dist/TalmudicFormulas.app"

          cd dist
          zip -r "../TalmudicFormulas-Mac-${{ matrix.label }}.zip" TalmudicFormulas.app || true

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            Output/TalmudicFormulas-Setup-Win.exe
            dist-portable/TalmudicFormulas-Portable.exe

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.arch }}
          path: |
            TalmudicFormulas-Mac-${{ matrix.label }}.dmg
            TalmudicFormulas-Mac-${{ matrix.label }}.zip

  release:
    name: Create Release
    needs: [version, build]
    # מתפרסם כל עוד חישוב הגרסה הצליח והריצה לא בוטלה ידנית —
    # כך שכשל/דילוג של פלטפורמה בודדת לא חוסם את שאר הגרסאות
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "גרסה ${{ needs.version.outputs.tag }}"
          body: |
            ## גרסה ${{ needs.version.outputs.tag }} — נוסחאות התלמוד

            ---

            ### Windows

            | סוג | קישור |
            |-----|-------|
            | גרסת התקנה | [לחצו כאן להורדת גרסת התקנה](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Setup-Win.exe) |
            | גרסה ניידת | [לחצו כאן להורדת גרסה ניידת](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Portable.exe) |

            ---

            ### macOS — Apple Silicon (M1/M2/M3 ומעלה)

            | סוג | קישור |
            |-----|-------|
            | גרסת התקנה | [לחצו כאן להורדת גרסת התקנה](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Mac-AppleSilicon.dmg) |
            | גרסה ניידת | [לחצו כאן להורדת גרסה ניידת](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Mac-AppleSilicon.zip) |

            ---

            ### macOS — Intel

            | סוג | קישור |
            |-----|-------|
            | גרסת התקנה | [לחצו כאן להורדת גרסת התקנה](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Mac-Intel.dmg) |
            | גרסה ניידת | [לחצו כאן להורדת גרסה ניידת](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/TalmudicFormulas-Mac-Intel.zip) |

            ---

            > **הערה למשתמשי מק:** הורידו את הגרסה המתאימה למעבד שלכם. מחשבי Mac משנת 2020 ואילך הם בדרך כלל Apple Silicon (M1/M2/M3); מחשבים ישנים יותר הם Intel. אם אינכם בטוחים: תפריט אפל () ← "על אודות Mac זה" ← שורת "שבב"/"מעבד".


          files: |
            artifacts/windows-build/**/TalmudicFormulas-Setup-Win.exe
            artifacts/windows-build/**/TalmudicFormulas-Portable.exe
            artifacts/macos-build-silicon/**/TalmudicFormulas-Mac-AppleSilicon.dmg
            artifacts/macos-build-silicon/**/TalmudicFormulas-Mac-AppleSilicon.zip
            artifacts/macos-build-intel/**/TalmudicFormulas-Mac-Intel.dmg
            artifacts/macos-build-intel/**/TalmudicFormulas-Mac-Intel.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
