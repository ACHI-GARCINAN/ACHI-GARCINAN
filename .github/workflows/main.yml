name: Build and Release

on:
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "main_window.py"
      - "db.py"
      - "settings_manager.py"
      - "styles.py"
      - "utils.py"
      - "icons.py"
      - "widgets/**"
      - "assets/**"
      - "icon.ico"
      - "setup_script.iss"
  workflow_dispatch:

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: get_version
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | tr -d 'v' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | tr -d 'v' | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEXT_MINOR}"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG"

  download-db:
    name: Download DB from release
    runs-on: ubuntu-latest
    steps:
      - name: Download talmud.db
        run: |
          curl -f -L -o talmud.db \
            "https://github.com/ACHI-GARCINAN/Talmud-Formulas-Software/releases/download/1.0/talmud.db"
      - name: Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: talmud-db
          path: talmud.db

  build:
    name: Build on ${{ matrix.os }}
    needs: [version, download-db]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download DB
        uses: actions/download-artifact@v4
        with:
          name: talmud-db
      - name: Prepare DB
        run: |
          mkdir -p project
          mv talmud.db project/talmud.db
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyinstaller PyQt6
      - name: Build with PyInstaller
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            pyinstaller --noconfirm --onefile --windowed --add-data "project/talmud.db;project" main.py
          else
            pyinstaller --noconfirm --onefile --windowed --add-data "project/talmud.db:project" main.py
          fi