name: Build and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Version
      id: get_version
      shell: bash
      run: |
        git fetch --tags --force
        LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
        if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v1.0"; fi
        VERSION_MINOR=$(echo $LATEST_TAG | cut -d. -f2)
        NEW_MINOR=$((VERSION_MINOR + 1))
        echo "new_tag=v1.$NEW_MINOR" >> $GITHUB_OUTPUT
        echo "version_pure=1.$NEW_MINOR" >> $GITHUB_OUTPUT

    - name: Create Git Tag
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        if git rev-parse "${{ steps.get_version.outputs.new_tag }}" >/dev/null 2>&1; then
          echo "Tag already exists"
        else
          git tag ${{ steps.get_version.outputs.new_tag }}
          git push origin ${{ steps.get_version.outputs.new_tag }}
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        pip install pyinstaller gdown macholib PyQt6 PyQt6-Qt6 Pillow

    - name: Download DB
      shell: bash
      run: gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        choco install innosetup --no-progress
        # בנייה לתיקיית dist-installer עם השם המדויק ש-Inno Setup מחפש
        pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="Talmudic-Formulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
        
        # יצירת גרסה ניידת (קובץ EXE אחד)
        pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="Talmudic-Formulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 main.py
        
        # עדכון גרסה ב-Inno Setup והרצתו
        $VERSION = "${{ steps.get_version.outputs.version_pure }}"
        (Get-Content "setup_script.iss") -replace 'AppVersion=.*', "AppVersion=$VERSION" | Set-Content "setup_script.iss"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup_script.iss"

    - name: Build macOS
      if: contains(matrix.os, 'macos')
      run: |
        brew install create-dmg
        # בנייה ללא אייקון במק למניעת שגיאת פורמט .ico
        pyinstaller --noconfirm --windowed --target-arch universal2 --name="Talmudic-Formulas-Mac" --add-data "talmud.db:." --add-data "widgets:widgets" --add-data "assets:assets" --collect-all PyQt6 main.py
        
        # יצירת קובץ DMG (התקנה)
        mkdir -p dist/dmg
        create-dmg \
          --volname "Talmudic Formulas" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Talmudic-Formulas-Mac.app" 175 120 \
          --app-drop-link 425 120 \
          "dist/Talmudic-Formulas-Mac-Installer.dmg" \
          "dist/Talmudic-Formulas-Mac.app"
        
        # יצירת גרסה ניידת (ZIP)
        cd dist && zip -r ../Talmudic-Formulas-Mac-Portable.zip Talmudic-Formulas-Mac.app && cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.new_tag }}
        name: גרסה ${{ steps.get_version.outputs.new_tag }}
        body: |
          ### Windows
          * [הורדת מתקין (Setup)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.new_tag }}/Talmudic-Formulas-Setup-Win.exe)
          * [הורדת גרסה ניידת (Portable EXE)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.new_tag }}/Talmudic-Formulas-Portable.exe)

          ### macOS
          * [הורדת מתקין (DMG)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.new_tag }}/Talmudic-Formulas-Mac-Installer.dmg)
          * [הורדת גרסה ניידת (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.new_tag }}/Talmudic-Formulas-Mac-Portable.zip)
        files: |
          Output/*.exe
          dist/*.exe
          dist/*.dmg
          *.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
