name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-13
            platform: macos-intel
          - os: macos-latest
            platform: macos-arm
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # חייב להיות 0 כדי לראות תגיות קודמות

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Calculate Version
      id: get_version
      shell: bash
      run: |
        git fetch --tags --force
        # מוצא את התגית האחרונה בפורמט v1.x
        LATEST_TAG=$(git tag -l "v1.*" | sort -V | tail -n1)
        
        if [ -z "$LATEST_TAG" ]; then
          # אם לא מצא תגיות בכלל, נתחיל מ-1.12
          NEW_TAG="v1.12"
        else
          # לוקח את המספר שאחרי הנקודה ומעלה ב-1
          CURRENT_MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          NEW_MINOR=$((CURRENT_MINOR + 1))
          NEW_TAG="v1.$NEW_MINOR"
        fi
        echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "Version calculated: $NEW_TAG"

    - name: Install Dependencies
      run: |
        pip install pyinstaller gdown PyQt6 PyQt6-Qt6 Pillow

    - name: Download DB
      shell: bash
      run: gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

    # --- Windows Build ---
    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: powershell
      run: |
        choco install innosetup --no-progress
        pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="TalmudicFormulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
        pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="TalmudicFormulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-portable main.py
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.get_version.outputs.tag }}" "setup_script.iss"

    # --- macOS Build ---
    - name: Build macOS
      if: startsWith(matrix.platform, 'macos')
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        brew install create-dmg
        ARCH=$(uname -m)
        pyinstaller --noconfirm --windowed --name="TalmudicFormulas-Mac-$ARCH" --add-data "talmud.db:." --add-data "widgets:widgets" --add-data "assets:assets" --collect-all PyQt6 --distpath ./dist main.py
        create-dmg --volname "Talmudic Formulas" "TalmudicFormulas-$ARCH-Installer.dmg" "dist/TalmudicFormulas-Mac-$ARCH.app" || true
        zip -r "TalmudicFormulas-Mac-$ARCH-Portable.zip" "dist/TalmudicFormulas-Mac-$ARCH.app"

# --- Create Release ---
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: גרסה ${{ steps.get_version.outputs.tag }}
        body: |
          ## הורדות ישירות לגרסה ${{ steps.get_version.outputs.tag }}
          
          ---

          ### Windows (ווינדוס)
          * **[הורדת מתקין (Setup)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-Setup-Win.exe)** (מומלץ למשתמשי PC)
          * **[הורדת גרסה ניידת (Portable)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-Portable.exe)** (קובץ בודד ללא התקנה)

          ---

          ###  macOS Apple Silicon (מעבדי M1, M2, M3 ומעלה)
          * **[הורדת מתקין (DMG)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-arm64-Installer.dmg)**
          * **[הורדת גרסה ניידת (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-Mac-arm64-Portable.zip)**

          ---

          ### macOS Intel (מעבדי אינטל ישנים)
          * **[הורדת מתקין (DMG)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-x86_64-Installer.dmg)**
          * **[הורדת גרסה ניידת (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/TalmudicFormulas-Mac-x86_64-Portable.zip)**

          ---
           **טיפ למשתמשי מק:** אם אינכם בטוחים איזה מעבד יש לכם, לחצו על תפריט התפוח () בפינת המסך ובחרו ב-"אודות מק זה" (About This Mac).
        files: |
          Output/*.exe
          dist-portable/*.exe
          *.dmg
          *.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
