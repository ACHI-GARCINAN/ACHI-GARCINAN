name: Build and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Version
      id: get_version
      shell: bash
      run: |
        git fetch --tags
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0")
        VERSION_MINOR=$(echo $LATEST_TAG | cut -d. -f2)
        NEW_MINOR=$((VERSION_MINOR + 1))
        echo "new_tag=v1.$NEW_MINOR" >> $GITHUB_OUTPUT
        echo "version_pure=1.$NEW_MINOR" >> $GITHUB_OUTPUT

    - name: Create Git Tag
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        # בדיקה אם התג כבר קיים למניעת שגיאת exit code 128
        if git rev-parse "${{ steps.get_version.outputs.new_tag }}" >/dev/null 2>&1; then
          echo "Tag ${{ steps.get_version.outputs.new_tag }} already exists, skipping..."
        else
          git tag ${{ steps.get_version.outputs.new_tag }}
          git push origin ${{ steps.get_version.outputs.new_tag }}
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pip install pyinstaller PyQt6 gdown macholib
        pip install --upgrade --force-reinstall PyQt6 PyQt6-Qt6

    - name: Install Dependencies (macOS)
      if: contains(matrix.os, 'macos')
      run: |
        pip install pyinstaller gdown macholib
        # התקנה ספציפית למק שתומכת ב-Universal2
        pip install --upgrade --only-binary=:all: --platform macosx_10_14_universal2 PyQt6 PyQt6-Qt6

    - name: Download DB
      shell: bash
      run: gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        choco install innosetup --no-progress
        # בניית גרסת Portable
        pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="Talmudic-Formulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-portable main.py
        # בנייה להתקנה (Onedir) - זו הגרסה שמשתמשת בתיקיית _internal
        pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="Talmudic-Formulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
        
        $VERSION = "${{ steps.get_version.outputs.version_pure }}"
        (Get-Content "setup_script.iss") -replace 'AppVersion=.*', "AppVersion=$VERSION" | Set-Content "setup_script.iss"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup_script.iss"

    - name: Build macOS (Universal2)
      if: contains(matrix.os, 'macos')
      run: |
        pyinstaller --noconfirm --windowed --target-arch universal2 --name="Talmudic-Formulas-Mac" --add-data "talmud.db:." --add-data "widgets:widgets" --add-data "assets:assets" --collect-all PyQt6 main.py
        cd dist && zip -r ../Talmudic-Formulas-Mac-Portable.zip Talmudic-Formulas-Mac.app && cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.new_tag }}
        files: |
          dist-portable/*.exe
          Output/*.exe
          *.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}