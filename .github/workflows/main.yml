name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-13
            platform: macos-intel
          - os: macos-latest
            platform: macos-arm
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install Dependencies
      run: |
        pip install pyinstaller gdown PyQt6 PyQt6-Qt6 Pillow

    - name: Download DB
      shell: bash
      run: gdown "1_jWI2qNMSyBkH3EneM2mZg-Wzibn_gLw" -O talmud.db

    # --- Windows Build ---
    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: powershell
      run: |
        choco install innosetup --no-progress
        # בנייה ל-Installer
        pyinstaller --noconfirm --onedir --windowed --icon="icon.ico" --name="TalmudicFormulas" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-installer main.py
        # בנייה לגרסה ניידת
        pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --name="TalmudicFormulas-Portable" --add-data "talmud.db;." --add-data "widgets;widgets" --add-data "assets;assets" --collect-all PyQt6 --distpath ./dist-portable main.py
        # יצירת ה-Installer (הקובץ שיוצא לתיקיית Output)
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup_script.iss"

    # --- macOS Build ---
    - name: Build macOS
      if: startsWith(matrix.platform, 'macos')
      run: |
        brew install create-dmg
        ARCH=$(uname -m)
        pyinstaller --noconfirm --windowed --name="TalmudicFormulas-Mac-$ARCH" --add-data "talmud.db:." --add-data "widgets:widgets" --add-data "assets:assets" --collect-all PyQt6 --distpath ./dist main.py
        # יצירת DMG
        create-dmg --volname "Talmudic Formulas" "TalmudicFormulas-$ARCH-Installer.dmg" "dist/TalmudicFormulas-Mac-$ARCH.app" || true
        # יצירת Zip
        zip -r "TalmudicFormulas-Mac-$ARCH-Portable.zip" "dist/TalmudicFormulas-Mac-$ARCH.app"

    # --- Create Release with Body ---
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.${{ github.run_number }}
        name: גרסה v1.${{ github.run_number }}
        body: |
          ##  הורדות ישירות (Direct Downloads)

          ###  Windows (ווינדוס)
          * **התקנה מלאה:** הורידו את קובץ ה-`Setup-Win.exe` (מומלץ).
          * **גרסה ניידת:** הורידו את קובץ ה-`Portable.exe` להרצה ללא התקנה.

          ###  macOS (מאק)
          * **מעבדי Apple Silicon (M1, M2, M3):** הורידו את קובץ ה-`arm64`.
          * **מעבדי Intel:** הורידו את קובץ ה-`x86_64`.
          
          ---
          *כל הגרסאות כוללות את בסיס הנתונים המעודכן.*
        files: |
          Output/*.exe
          dist-portable/*.exe
          *.dmg
          *.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}