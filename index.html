<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נוסחאות התלמוד - דף הבית</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#002855',
                        brandLight: '#004085'
                    }
                }
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>

    <style>
        body { font-family: 'Assistant', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .hero-icon { transition: transform 0.5s ease; }
        .hero-icon:hover { transform: scale(1.05); }
    </style>

    <!-- 🔴 כאן אתה מדביק את קישור ה-DB שלך מ-GitHub Releases -->
    <script>
        const DB_BASE = "PASTE_YOUR_GITHUB_RELEASE_BASE_URL_HERE";
        /*
        דוגמה:
        https://github.com/USER/REPO/releases/download/data-v1
        */
    </script>
</head>

<body class="bg-white text-gray-900 dark:bg-black dark:text-gray-100">

<script>
function detectOS() {
    const ua = navigator.userAgent.toLowerCase();
    if (ua.includes("win")) return "windows";
    if (ua.includes("mac")) return "mac";
    return "windows";
}

const OS = detectOS();

function hide(el) {
    if (el) el.style.display = "none";
}
</script>

<div class="max-w-6xl mx-auto px-4 py-4 grid grid-cols-3 items-center border-b border-gray-100 dark:border-gray-900">

    <div class="flex gap-6 items-center justify-start">
        <a href="https://github.com/ACHI-GARCINAN/ACHI-GARCINAN" target="_blank">
            GitHub
        </a>
    </div>

    <div class="flex justify-center">
        <img src="https://img.shields.io/github/downloads/achi-garcinan/ACHI-GARCINAN/total?label=הורדות&color=002855&style=flat">
    </div>

    <div class="flex justify-end">
        <button onclick="toggleDarkMode()" class="p-2 bg-gray-100 dark:bg-gray-800 rounded-full">
            🌙
        </button>
    </div>

</div>

<header class="text-center py-14 px-4">

    <h1 class="text-5xl font-bold mb-4 text-brand dark:text-blue-400">
        נוסחאות התלמוד
    </h1>

    <p class="text-xl max-w-3xl mx-auto opacity-80 mb-10">
        תוכנה להצגת נוסחאות תלמוד
    </p>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">

        <!-- 🪟 WINDOWS -->
        <div id="windows-box" class="bg-gray-50 dark:bg-gray-900 p-8 rounded-3xl border">

            <h3 class="text-lg font-bold mb-6">גרסה לווינדוס</h3>

            <a id="win-btn"
               class="bg-brand hover:bg-brandLight text-white font-bold py-4 px-6 rounded-2xl block">
                הורדה לווינדוס
            </a>

        </div>

        <!-- 🍎 MAC -->
        <div id="mac-box" class="bg-gray-50 dark:bg-gray-900 p-8 rounded-3xl border">

            <h3 class="text-lg font-bold mb-6">גרסה למאק</h3>

            <a id="mac-btn"
               class="bg-brand hover:bg-brandLight text-white font-bold py-4 px-6 rounded-2xl block">
                הורדה למאק
            </a>

        </div>

    </div>

</header>

<script>
window.addEventListener("DOMContentLoaded", () => {

    const os = OS;

    // Windows
    const winBtn = document.getElementById("win-btn");
    const macBtn = document.getElementById("mac-btn");

    if (!DB_BASE || DB_BASE.includes("PASTE_YOUR")) {
        console.error("DB_BASE לא מוגדר!");
        return;
    }

    if (os === "windows") {

        winBtn.href = `${DB_BASE}/Talmudic-Formulas-Setup-Win.exe`;

        // הסתר מק לגמרי
        hide(document.getElementById("mac-box"));

    } else {

        macBtn.href = `${DB_BASE}/Talmudic-Formulas-Mac-Installer.dmg`;

        // הסתר ווינדוס לגמרי
        hide(document.getElementById("windows-box"));
    }

});
</script>

</body>
</html>
